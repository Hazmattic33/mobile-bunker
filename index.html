<style>
:root{
  --black:#0B0B0B; --panel:#131313; --card:#191919; --gray:#232323; --line:#2E2E2E;
  --text:#FFFFFF; --muted:#B5B5B5; --green:#66DD22; --green-dk:#4CA818; --green-glow:rgba(102,221,34,.28);
  --r:16px; --rlg:22px; --max:1200px;
  --f-head:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--black);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:800;line-height:1.02;letter-spacing:.4px;margin:0 0 .4em;text-transform:uppercase}
h1{font-size:clamp(2.6rem,7vw,5rem)}
h2{font-size:clamp(2rem,4.6vw,3.2rem)}
h3{font-size:clamp(1.25rem,2.2vw,1.6rem)}
p{margin:0 0 1rem}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 22px}
.sec{padding:88px 0}
.sec.tight{padding:60px 0}
.sec.panel{background:var(--panel)}
.eyebrow{font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--green);margin:0 0 14px}
.lead{color:var(--muted);font-size:1.06rem;max-width:62ch}
.center{text-align:center}
.center .lead{margin-left:auto;margin-right:auto}
.skip{position:absolute;left:-9999px;top:0;background:var(--green);color:#000;padding:12px 18px;z-index:999;border-radius:0 0 10px 0;font-weight:700}
.skip:focus{left:0}
/* ---------- buttons ---------- */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:52px;padding:14px 28px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,color .18s ease;text-align:center}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.btn-primary{background:var(--green);color:#07160B;box-shadow:0 8px 26px -10px var(--green-glow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px -10px var(--green-glow)}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn-ghost:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px)}
.btn-sm{min-height:42px;padding:9px 20px;font-size:.92rem}
.btn-block{width:100%}
/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:60;background:rgba(11,11,11,.72);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);transition:background .25s}
.hdr.scrolled{background:rgba(11,11,11,.96)}
.nav{display:flex;align-items:center;gap:18px;height:74px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-size:1.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.mark-img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.ftr-logo{width:160px;height:auto;margin-bottom:16px;border-radius:14px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#07160B;font-size:1.15rem;box-shadow:0 6px 18px -8px var(--green-glow)}
.logo .thin{color:var(--muted);font-weight:600}
.navlinks{display:flex;align-items:center;gap:4px;margin-left:auto}
.navlinks a{padding:10px 13px;border-radius:10px;font-size:.93rem;font-weight:600;color:#DDD;position:relative;transition:color .2s,background .2s}
.navlinks a:hover{color:#fff;background:rgba(255,255,255,.06)}
.navlinks a.active{color:var(--green)}
.navlinks a.active::after{content:"";position:absolute;left:13px;right:13px;bottom:4px;height:2px;background:var(--green);border-radius:2px}
.navcta{margin-left:10px}
.burger{display:none;margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;width:46px;height:46px;border-radius:12px;cursor:pointer;font-size:1.2rem}
.mobnav{display:none;border-top:1px solid rgba(255,255,255,.08);background:var(--panel)}
.mobnav.open{display:block;animation:fade .25s ease}
.mobnav a{display:block;padding:15px 22px;border-bottom:1px solid rgba(255,255,255,.06);font-weight:600}
.mobnav a.active{color:var(--green)}
.mobnav .btn{margin:16px 22px 22px;width:calc(100% - 44px)}
@media(max-width:1180px) and (min-width:1001px){.navlinks a{padding:10px 8px;font-size:.85rem}.navcta{padding:12px 18px;font-size:.88rem}.logo{font-size:1.3rem}}
@media(max-width:1000px){.navlinks,.navcta{display:none}.burger{display:block}}
/* ---------- hero ---------- */
.hero{position:relative;min-height:clamp(560px,86vh,860px);display:flex;align-items:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);animation:kenburns 22s ease-in-out infinite alternate}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(11,11,11,.97) 0%,rgba(11,11,11,.90) 38%,rgba(11,11,11,.62) 72%,rgba(11,11,11,.50) 100%),linear-gradient(0deg,rgba(11,11,11,.85) 0%,transparent 45%)}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.hero .wrap{position:relative;z-index:2;padding-top:70px;padding-bottom:70px}
.hero h1{max-width:16ch;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.hero h1 .g{color:var(--green)}
.hero-sub{font-size:clamp(1rem,1.5vw,1.2rem);color:#E4E4E4;max-width:60ch;margin-bottom:30px}
.hero-btns{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.hero-note{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:.93rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px var(--green-glow);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--green-glow)}50%{box-shadow:0 0 0 10px rgba(102,221,34,.06)}}
.hero-strip{background:var(--green);color:#07160B}
.hero-strip .wrap{display:flex;flex-wrap:wrap;gap:10px 40px;justify-content:center;padding-top:14px;padding-bottom:14px;font-weight:700;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
/* ---------- cards / grids ---------- */
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-6px);border-color:rgba(102,221,34,.45);box-shadow:0 22px 44px -26px rgba(0,0,0,.9)}
.card-img{aspect-ratio:16/10;background-size:cover;background-position:center;position:relative}
.card-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10) 30%,rgba(10,10,10,.82) 100%)}
.card-body{padding:22px 22px 24px;display:flex;flex-direction:column;flex:1}
.card-body p{color:var(--muted);font-size:.95rem;flex:1}
.nophoto::before{content:"Photo coming soon";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:rgba(255,255,255,.26);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;font-weight:700;z-index:1}
.gal .ph.nophoto::before{font-size:.62rem}
.tagpill{position:absolute;z-index:2;top:14px;left:14px;background:rgba(11,11,11,.78);border:1px solid rgba(102,221,34,.5);color:var(--green);font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
/* steps */
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:28px 24px;position:relative;overflow:hidden;transition:transform .25s,border-color .25s}
.step:hover{transform:translateY(-6px);border-color:rgba(102,221,34,.45)}
.step .num{font-family:var(--f-head);font-size:3.4rem;line-height:1;color:transparent;-webkit-text-stroke:2px var(--green);display:block;margin-bottom:12px}
.step p{color:var(--muted);font-size:.95rem;margin:0}
/* games */
.game{background:linear-gradient(160deg,var(--gray),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:24px 20px;display:flex;align-items:center;gap:14px;font-family:var(--f-head);font-size:1.35rem;text-transform:uppercase;transition:transform .22s,border-color .22s,background .22s}
.game:hover{transform:translateY(-5px);border-color:var(--green);background:linear-gradient(160deg,#1f2b18,var(--card))}
.game .ic{width:44px;height:44px;flex:none;border-radius:12px;background:rgba(102,221,34,.13);display:grid;place-items:center;font-size:1.3rem}
/* why */
.why{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:transform .22s,border-color .22s}
.why:hover{transform:translateY(-4px);border-color:rgba(102,221,34,.45)}
.why .ic{width:46px;height:46px;flex:none;border-radius:14px;background:rgba(102,221,34,.12);border:1px solid rgba(102,221,34,.28);display:grid;place-items:center;font-size:1.25rem}
.why strong{display:block;font-weight:600;font-size:.99rem}
/* cta band */
.cta{background:radial-gradient(1100px 420px at 50% 0%,rgba(102,221,34,.16),transparent 70%),var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cta h2 .g{color:var(--green)}
/* footer */
.ftr{background:#070707;border-top:1px solid var(--line);padding:60px 0 26px;font-size:.94rem}
.ftr-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:34px}
@media(max-width:860px){.ftr-grid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.ftr-grid{grid-template-columns:1fr}}
.ftr h4{font-size:1.05rem;color:#fff;margin-bottom:14px;letter-spacing:.12em}
.ftr a,.ftr li{color:var(--muted)}
.ftr a:hover{color:var(--green)}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.socials{display:flex;gap:10px;margin-top:16px}
.socials a{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.socials a:hover{background:var(--green);color:#07160B;border-color:var(--green);transform:translateY(-3px)}
.ftr-btm{margin-top:38px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;color:#7C7C7C;font-size:.86rem}
.ftr-tag{font-family:var(--f-head);text-transform:uppercase;color:var(--green);letter-spacing:.1em;font-size:1.05rem}

.pkg-table{max-width:760px;margin:38px auto 0;border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.02)}
.pkg-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.07)}
.pkg-row:last-child{border-bottom:0}
.pkg-h{font-weight:700;font-size:1.02rem;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pkg-tag{font-family:'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;font-size:.7rem;color:var(--green);border:1px solid rgba(126,217,64,.42);border-radius:999px;padding:3px 10px}
.pkg-p{font-family:'Barlow Condensed',sans-serif;font-size:1.55rem;font-weight:700;color:var(--green);white-space:nowrap}
.inc-box{max-width:760px;margin:30px auto 0;padding:26px 28px;border:1px solid rgba(126,217,64,.28);border-radius:16px;background:rgba(126,217,64,.05)}
.inc-box h3{margin:0 0 14px;font-size:1.05rem}
.inc-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px 22px}
.inc-list li{position:relative;padding-left:22px;font-size:.95rem;opacity:.88}
.inc-list li:before{content:'';position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--green)}
.ao-p{float:right;color:var(--green);font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:.03em}
@media(max-width:560px){.pkg-row{padding:14px 16px}.pkg-p{font-size:1.3rem}.ao-p{float:none;display:block;margin-top:4px}}

.tier-band{display:flex;align-items:center;gap:20px;margin:0 0 28px}
.tier-band:before,.tier-band:after{content:'';flex:1;height:1px;background:rgba(255,255,255,.12)}
.tier-band span{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;font-size:1.55rem;padding:8px 28px;border-radius:999px}
.tier-band.tb-primary span{background:var(--green);color:#0b0b0b}
.tier-band:not(.tb-primary) span{color:var(--green);border:1px solid rgba(126,217,64,.45)}
.grid.g3+.tier-band{margin-top:58px}
.tier-name{margin:0 0 6px;font-size:1.3rem}
@media(max-width:560px){.tier-band{gap:12px}.tier-band span{font-size:1.2rem;padding:7px 18px}}

.prize-box{display:flex;gap:22px;align-items:center;max-width:820px;margin:28px auto 0;background:#141414;border:1px solid #262626;border-radius:18px;padding:18px;text-align:left}
.prize-img{flex:0 0 190px}
.prize-img img{width:100%;height:168px;object-fit:cover;object-position:center 34%;border-radius:12px;display:block}
.prize-txt h4{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:19px;margin:0 0 8px;color:var(--green)}
.prize-txt p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
@media(max-width:640px){.prize-box{flex-direction:column;text-align:center}.prize-img{flex:none;width:100%}.prize-txt h4{text-align:center}}
</style>
<style>
/* ---------- page header ---------- */
.phead{padding:78px 0 54px;background:radial-gradient(900px 340px at 12% -10%,rgba(102,221,34,.16),transparent 65%),var(--panel);border-bottom:1px solid var(--line)}
.phead h1{font-size:clamp(2.3rem,5.4vw,4rem);margin-bottom:.25em}
.crumb{color:var(--muted);font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
/* ---------- events page ---------- */
.evt{display:grid;grid-template-columns:1.05fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);overflow:hidden;margin-bottom:34px}
.evt:nth-child(even) .evt-media{order:2}
.evt-media{min-height:340px;background-size:cover;background-position:center}
.evt-body{padding:34px}
@media(max-width:860px){.evt{grid-template-columns:1fr}.evt:nth-child(even) .evt-media{order:0}.evt-media{min-height:230px}.evt-body{padding:26px 22px}}
.spec{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:12px}
.spec li{display:flex;gap:12px;align-items:flex-start;font-size:.95rem;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:11px}
.spec li:last-child{border-bottom:0}
.spec b{color:#fff;font-weight:600;min-width:150px;display:inline-block;flex:none}
.quote-box{border-left:3px solid var(--green);background:rgba(102,221,34,.06);padding:16px 20px;border-radius:0 var(--r) var(--r) 0;color:#E9E9E9;font-size:1rem;margin:0 0 22px}
/* ---------- pricing ---------- */
.price{background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:30px 26px;display:flex;flex-direction:column;transition:transform .25s,border-color .25s}
.price:hover{transform:translateY(-6px);border-color:var(--green)}
.price .from{color:var(--muted);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.price .amt{font-family:var(--f-head);font-size:3.1rem;color:var(--green);line-height:1;margin:6px 0 4px}
.price .amt.small{font-size:2rem}
.price ul{list-style:none;padding:0;margin:16px 0 22px;display:grid;gap:9px;color:var(--muted);font-size:.93rem;flex:1}
.price li::before{content:"\2713";color:var(--green);font-weight:800;margin-right:9px}
.addons{columns:2;column-gap:34px;list-style:none;padding:0;margin:0}
@media(max-width:640px){.addons{columns:1}}
.addons li{break-inside:avoid;padding:13px 0 13px 30px;border-bottom:1px solid var(--line);color:var(--muted);position:relative}
.addons li::before{content:"+";position:absolute;left:0;top:11px;width:20px;height:20px;border-radius:50%;background:rgba(102,221,34,.14);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.note{background:var(--gray);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:var(--r);padding:18px 22px;color:var(--muted);font-size:.95rem}
/* ---------- gallery ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.filters button{background:var(--card);border:1px solid var(--line);color:#DDD;padding:10px 20px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;min-height:44px;transition:all .2s}
.filters button:hover{border-color:var(--green);color:#fff}
.filters button.on{background:var(--green);border-color:var(--green);color:#07160B}
.gal{columns:3;column-gap:18px}
@media(max-width:900px){.gal{columns:2}}
@media(max-width:560px){.gal{columns:1}}
.gal figure{break-inside:avoid;margin:0 0 18px;border-radius:var(--r);overflow:hidden;position:relative;cursor:zoom-in;border:1px solid var(--line);background:var(--card);animation:fade .4s ease}
.gal .ph{width:100%;background-size:cover;background-position:center}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 14px;background:linear-gradient(180deg,transparent,rgba(6,6,6,.9));font-size:.88rem;opacity:0;transform:translateY(8px);transition:.25s}
.gal figure:hover figcaption{opacity:1;transform:none}
.lb{position:fixed;inset:0;background:rgba(4,4,4,.94);z-index:200;display:none;align-items:center;justify-content:center;padding:26px;animation:fade .2s}
.lb.open{display:flex}
.lb .inner{max-width:1000px;width:100%;text-align:center}
.lb .shot{width:100%;height:min(72vh,620px);background-size:contain;background-position:center;background-repeat:no-repeat;border-radius:var(--r)}
.lb .cap{margin-top:14px;color:var(--muted)}
.lb .x{position:absolute;top:18px;right:22px;background:var(--card);border:1px solid var(--line);color:#fff;width:48px;height:48px;border-radius:50%;font-size:1.3rem;cursor:pointer}
.lb .arw{position:absolute;top:50%;transform:translateY(-50%);background:var(--card);border:1px solid var(--line);color:#fff;width:50px;height:50px;border-radius:50%;font-size:1.4rem;cursor:pointer}
.lb .prev{left:18px}.lb .next{right:18px}
/* ---------- faq ---------- */
.faq{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:12px;overflow:hidden}
.faq button{width:100%;text-align:left;background:transparent;border:0;color:#fff;padding:22px 56px 22px 24px;font-size:1.04rem;font-weight:600;cursor:pointer;position:relative;min-height:64px}
.faq button::after{content:"+";position:absolute;right:22px;top:50%;transform:translateY(-50%);color:var(--green);font-size:1.7rem;font-weight:400;transition:transform .25s}
.faq.open button::after{transform:translateY(-50%) rotate(45deg)}
.faq .ans{max-height:0;overflow:hidden;transition:max-height .35s ease}
.faq.open .ans{max-height:400px}
.faq .ans p{padding:0 24px 22px;color:var(--muted);margin:0}
/* ---------- forms ---------- */
.formwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:34px}
@media(max-width:640px){.formwrap{padding:24px 18px}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:.85rem;font-weight:600;letter-spacing:.05em;color:#E2E2E2}
label .req{color:var(--green)}
input,select,textarea{background:var(--gray);border:1px solid var(--line);color:#fff;border-radius:12px;padding:13px 15px;min-height:50px;width:100%;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--green);background:#262626;outline:none}
textarea{min-height:130px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--green) 50%),linear-gradient(135deg,var(--green) 50%,transparent 50%);background-position:calc(100% - 21px) 22px,calc(100% - 15px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.checks{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.checks{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:10px;background:var(--gray);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:.92rem;min-height:50px;transition:.2s}
.chk:hover{border-color:rgba(102,221,34,.5)}
.chk input{width:19px;height:19px;min-height:0;accent-color:var(--green);flex:none}
.chk.on{border-color:var(--green);background:rgba(102,221,34,.09)}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.err{color:#FF6B6B;font-size:.82rem}
.thanks{background:rgba(102,221,34,.09);border:1px solid var(--green);border-radius:var(--rlg);padding:40px 30px;text-align:center;animation:fade .35s}
.thanks .tick{width:70px;height:70px;border-radius:50%;background:var(--green);color:#07160B;display:grid;place-items:center;font-size:2rem;margin:0 auto 18px}
.contact-item{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.contact-item .ic{width:46px;height:46px;flex:none;border-radius:14px;background:rgba(102,221,34,.12);border:1px solid rgba(102,221,34,.28);display:grid;place-items:center;font-size:1.2rem}
.contact-item span{display:block;color:var(--muted);font-size:.86rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
/* ---------- reviews ---------- */
.empty-reviews{border:1px dashed var(--line);border-radius:var(--rlg);padding:52px 26px;text-align:center;background:var(--card)}
.stars{color:var(--green);letter-spacing:3px;font-size:1.1rem}
/* ---------- admin ---------- */
.adm-shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
@media(max-width:860px){.adm-shell{grid-template-columns:1fr}}
.adm-side{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px}
.adm-side button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:600;margin-bottom:4px;min-height:46px}
.adm-side button:hover{background:var(--gray);color:#fff}
.adm-side button.on{background:var(--green);color:#07160B}
.adm-main{padding:30px}
@media(max-width:640px){.adm-main{padding:20px 14px}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat b{font-family:var(--f-head);font-size:2.2rem;color:var(--green);display:block;line-height:1}
.stat span{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.12em}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:900px;font-size:.9rem}
th{text-align:left;padding:14px;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;border:1px solid}
.b-new{color:#66DD22;border-color:#66DD22;background:rgba(102,221,34,.1)}
.b-contacted{color:#FFC44D;border-color:#FFC44D;background:rgba(255,196,77,.1)}
.b-quoted{color:#6FB6FF;border-color:#6FB6FF;background:rgba(111,182,255,.1)}
.b-booked{color:#C08BFF;border-color:#C08BFF;background:rgba(192,139,255,.1)}
.b-completed{color:#8F8F8F;border-color:#5A5A5A;background:rgba(255,255,255,.04)}
.b-declined{color:#FF7A7A;border-color:#FF7A7A;background:rgba(255,122,122,.1)}
.adm-card{background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:24px;margin-bottom:20px}
.adm-card h3{margin-bottom:16px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--gray);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.tog{position:relative;width:54px;height:30px;flex:none;background:#3A3A3A;border-radius:999px;cursor:pointer;border:0;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--green)}
.tog.on::after{transform:translateX(24px)}
.login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:36px}
.mini{font-size:.82rem;color:#8A8A8A}
.warnbox{background:rgba(255,196,77,.08);border:1px solid rgba(255,196,77,.45);color:#FFD98A;border-radius:var(--r);padding:14px 18px;font-size:.88rem;margin-bottom:20px}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px}
.tiny{background:var(--gray);border:1px solid var(--line);color:#DDD;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:.8rem;min-height:38px}
.tiny:hover{border-color:var(--green);color:#fff}
.tiny.danger:hover{border-color:#FF7A7A;color:#FF7A7A}
/* ---------- misc ---------- */
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(26px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

/* ---------------- utils: image compression ---------------- */
function compress(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1600, w=img.width, h=img.height;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function setPath(obj,path,val){
  var p=path.split('.'), o=obj;
  for(var i=0;i<p.length-1;i++){ o=o[p[i]]; }
  o[p[p.length-1]]=val;
}
function collectFields(scope){
  scope.querySelectorAll('[data-c]').forEach(function(f){ setPath(S,f.getAttribute('data-c'),f.value); });
  save();
}
function toCSV(){
  var L=leads();
  var cols=['submitted','status','name','email','phone','etypeLabel','date','start','hours','loc','setting','guests','games','notes'];
  var rows=[cols.join(',')].concat(L.map(function(l){
    return cols.map(function(c){
      var v=l[c]; if(Array.isArray(v)) v=v.join(' | ');
      return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(',');
  }));
  var blob=new Blob([rows.join('\n')],{type:'text/csv'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='mobile-bunker-leads-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}

/* ---------------- form ---------------- */
function wireForm(){
  var f=el('quote'); if(!f) return;
  var q=location.hash.split('?')[1]||'';
  if(q.indexOf('type=')>-1){
    var t=decodeURIComponent(q.split('type=')[1].split('&')[0]);
    var map={weddings:'wedding',corporate:'corporate',breweries:'brewery',parties:'parties',fundraisers:'fundraiser',tournaments:'tournament'};
    var v=map[t]||t; var sel=el('etype');
    for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value===v){ sel.selectedIndex=i; } }
  }
  el('games').addEventListener('change',function(e){
    var l=e.target.closest('.chk'); if(l) l.classList.toggle('on',e.target.checked);
  });
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var ok=true;
    function bad(id,msg){ var e=el('e_'+id); if(e){ e.textContent=msg||''; } if(msg) ok=false; }
    ['name','email','phone','etype','date','start','loc','setting','guests','hours','notes'].forEach(function(id){
      var v=el(id).value.trim(); bad(id, v? '' : 'Required');
    });
    var em=el('email').value.trim();
    if(em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) bad('email','Enter a valid email address');
    var ph=el('phone').value.replace(/[^0-9]/g,'');
    if(ph && ph.length<10) bad('phone','Enter a valid phone number');
    var picked=[].slice.call(document.querySelectorAll('#games input:checked')).map(function(c){return c.value;});
    bad('games', picked.length? '' : 'Choose at least one');
    /* spam protection: honeypot + minimum time on form */
    if(el('website').value!==''){ return; }
    if(Date.now()-Number(el('ts').value) < 3000){ bad('notes','Please take a moment to review your details, then submit again.'); }
    if(!ok){ var first=document.querySelector('.err:not(:empty)'); if(first) first.scrollIntoView({block:'center'}); return; }

    var sel=el('etype');
    var lead={ id:'L'+Date.now(), submitted:new Date().toISOString(), status:'new', notes:'',
      name:el('name').value.trim(), email:em, phone:el('phone').value.trim(),
      etype:sel.value, etypeLabel:sel.options[sel.selectedIndex].text,
      date:el('date').value, start:el('start').value, loc:el('loc').value.trim(),
      setting:el('setting').value, guests:el('guests').value, hours:el('hours').value,
      games:picked, details:el('notes').value.trim() };
    var all=leads(); all.unshift(lead); saveLeads(all);

    /* Send to the business email. Set a form endpoint in Admin > Settings for real delivery. */
    if(S.formEndpoint){
      fetch(S.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}).catch(function(){});
    }

    el('formhost').innerHTML='<div class="thanks"><div class="tick">&#10003;</div>'
      +'<h2>Request Received</h2>'
      +'<p class="lead" style="margin:0 auto 20px">Thank you for contacting '+esc(S.brand.name)+'. We&rsquo;ll review your event details and follow up with availability and pricing.</p>'
      +'<a class="btn btn-ghost" href="#/gallery">Browse the gallery</a></div>';
    window.scrollTo({top:el('formhost').offsetTop-120,behavior:'smooth'});
  });
}

/* ---------------- lightbox ---------------- */
var lbIdx=0;
function openLb(i){
  var items=el('gal').__items||[]; if(!items.length) return;
  lbIdx=(i+items.length)%items.length; var x=items[lbIdx];
  el('lbimg').style.background = x.src ? 'url('+x.src+') center/contain no-repeat' : (PH[x.ph]||PH.equipment);
  el('lbcap').textContent = x.cat+' \u2014 '+x.cap;
  el('lb').classList.add('open'); el('lbx').focus();
}
el('lbx').onclick=function(){ el('lb').classList.remove('open'); };
el('lbp').onclick=function(){ openLb(lbIdx-1); };
el('lbn').onclick=function(){ openLb(lbIdx+1); };
el('lb').addEventListener('click',function(e){ if(e.target===el('lb')) el('lb').classList.remove('open'); });
document.addEventListener('keydown',function(e){
  if(!el('lb').classList.contains('open')) return;
  if(e.key==='Escape') el('lb').classList.remove('open');
  if(e.key==='ArrowLeft') openLb(lbIdx-1);
  if(e.key==='ArrowRight') openLb(lbIdx+1);
});

/* ---------------- reveal on scroll ---------------- */
var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{threshold:.12});
function wireReveal(){
  var ns=[].slice.call(document.querySelectorAll('.reveal'));
  ns.forEach(function(n){ io.observe(n); });
  /* safety net: if IntersectionObserver is throttled (background tab, reduced motion,
     older browsers) reveal anything already on screen so nothing stays invisible */
  var force=function(){ ns.forEach(function(n){ if(n.classList.contains('in')) return;
    var r=n.getBoundingClientRect(); if(r.top<window.innerHeight && r.bottom>0){ n.classList.add('in'); io.unobserve(n); } }); };
  setTimeout(force,350); setTimeout(force,1200);
  if(document.visibilityState!=='visible'){ document.addEventListener('visibilitychange',function h(){ force(); document.removeEventListener('visibilitychange',h); }); }
}


/* ---------------- admin wiring ---------------- */
function wireAdmin(){
  var lg=el('dologin');
  if(lg){
    var go=function(){ if(el('pw').value===ADMIN_PASS){ sessionStorage.setItem('tmb_auth','1'); router(); } else { el('e_pw').textContent='Incorrect passphrase.'; } };
    lg.onclick=go;
    el('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
    return;
  }
  document.querySelectorAll('.adm-side [data-tab]').forEach(function(b){
    b.onclick=function(){ admTab=b.getAttribute('data-tab'); router(); };
  });
  el('logout').onclick=function(){ sessionStorage.removeItem('tmb_auth'); router(); };
  el('viewsite').onclick=function(){ location.hash='#/'; };
  paintAdmin();
  var body=el('admbody');
  body.addEventListener('change',function(e){
    var t=e.target;
    if(t.hasAttribute&&t.hasAttribute('data-img')){
      var k=t.getAttribute('data-img'); if(t.files&&t.files[0]) compress(t.files[0],function(d){ S.images[k]=d; save(); alert('Image updated.'); });
    }
    if(t.id==='galfile'&&t.files.length){
      var cat=el('galcat').value, cap=el('galcap').value||'Untitled', n=t.files.length, done=0;
      [].slice.call(t.files).forEach(function(file){
        compress(file,function(d){ S.gallery.push({id:'g'+Date.now()+Math.random().toString(36).slice(2,6),cat:cat,cap:cap,src:d,h:260});
          done++; if(done===n){ save(); paintAdmin(); } });
      });
    }
    if(t.hasAttribute&&t.hasAttribute('data-st')){
      var i=+t.getAttribute('data-st'); var L=leads(); L[i].status=t.value; saveLeads(L); paintAdmin();
    }
  });
  body.addEventListener('click',function(e){
    var t=e.target.closest('button'); if(!t) return;
    var L;
    if(t.id==='csv'){ toCSV(); }
    if(t.id==='seed'){ L=leads(); L.unshift({id:'L'+Date.now(),submitted:new Date().toISOString(),status:'new',notes:'',
      name:'Sample Lead',email:'sample@email.com',phone:'(802) 555-0117',etype:'wedding',etypeLabel:'Wedding',
      date:'2026-09-19',start:'16:00',loc:'Barn at Wolf Hill, Hanover NH',setting:'Both / not sure yet',guests:'120',hours:'4',
      games:['Bride vs. Groom','Closest to the Pin'],details:'Sample record for testing the dashboard.'}); saveLeads(L); paintAdmin(); }
    if(t.hasAttribute('data-savenote')){ var i=+t.getAttribute('data-savenote'); L=leads();
      L[i].notes=document.querySelector('[data-note="'+i+'"]').value; saveLeads(L); t.textContent='Saved'; setTimeout(function(){t.textContent='Save note';},1200); }
    if(t.hasAttribute('data-detail')){ var d=leads()[+t.getAttribute('data-detail')];
      alert('EVENT DETAILS\n\n'+d.name+'\n'+d.email+' / '+d.phone+'\n'+d.etypeLabel+' \u2014 '+d.date+' '+d.start+'\n'+d.loc+'\n'+d.setting+' \u2014 '+d.guests+' guests \u2014 '+d.hours+'h\nGames: '+(d.games||[]).join(', ')+'\n\n'+d.details); }
    if(t.id==='savecontent'){ collectFields(body); renderFooter(); t.textContent='Saved'; setTimeout(function(){t.textContent='Save all content';},1200); }
    if(t.id==='savepricing'){ collectFields(body); S.addons=el('addons').value.split('\n').filter(function(x){return x.trim();}); save(); t.textContent='Saved'; setTimeout(function(){t.textContent='Save pricing';},1200); }
    if(t.id==='savesettings'){ collectFields(body); renderFooter(); t.textContent='Saved'; setTimeout(function(){t.textContent='Save settings';},1200); }
    if(t.hasAttribute('data-flag')){ var fl=t.getAttribute('data-flag'); S.flags[fl]=!S.flags[fl]; save(); paintAdmin(); }
    if(t.hasAttribute('data-why')){ var wi=+t.getAttribute('data-why'); var w=S.why[wi];
      if(w.flag){ S.flags[w.flag]=!S.flags[w.flag]; } else { w.hidden=!w.hidden; } save(); paintAdmin(); }
    if(t.id==='addrev'){ if(!el('rvt').value.trim()) return alert('Add review text.');
      S.reviews.push({name:el('rvn').value||'Anonymous',event:el('rve').value,stars:+el('rvs').value,text:el('rvt').value});
      S.flags.showReviews=true; save(); paintAdmin(); }
    if(t.hasAttribute('data-delrev')){ S.reviews.splice(+t.getAttribute('data-delrev'),1); save(); paintAdmin(); }
    if(t.hasAttribute('data-up')){ var u=+t.getAttribute('data-up'); if(u>0){ var a=S.gallery.splice(u,1)[0]; S.gallery.splice(u-1,0,a); save(); paintAdmin(); } }
    if(t.hasAttribute('data-down')){ var dn=+t.getAttribute('data-down'); if(dn<S.gallery.length-1){ var b2=S.gallery.splice(dn,1)[0]; S.gallery.splice(dn+1,0,b2); save(); paintAdmin(); } }
    if(t.hasAttribute('data-del')){ if(confirm('Remove this image from the gallery?')){ S.gallery.splice(+t.getAttribute('data-del'),1); save(); paintAdmin(); } }
    if(t.id==='savegal'){ document.querySelectorAll('[data-gcap]').forEach(function(f){ S.gallery[+f.getAttribute('data-gcap')].cap=f.value; });
      document.querySelectorAll('[data-gcat]').forEach(function(f){ S.gallery[+f.getAttribute('data-gcat')].cat=f.value; });
      save(); t.textContent='Saved'; setTimeout(function(){t.textContent='Save gallery';},1200); }
    if(t.id==='reset'){ if(confirm('Reset ALL site content to defaults? Quote requests are not affected.')){ localStorage.removeItem(KEY); S=load(); paintAdmin(); renderFooter(); } }
  });
}

/* ---------------- router ---------------- */
var ROUTES={ '#/':pageHome, '#/events':pageEvents, '#/how-it-works':pageHow, '#/pricing':pagePricing,
  '#/gallery':pageGallery, '#/faq':pageFaq, '#/contact':pageContact, '#/admin':pageAdmin,
  '#/privacy':function(){return pageLegal('privacy');}, '#/terms':function(){return pageLegal('terms');} };
var TITLES={ '#/':'The Mobile Bunker | Mobile Golf Simulator Rentals in NH & VT',
  '#/events':'Event Types | The Mobile Bunker', '#/how-it-works':'How It Works | The Mobile Bunker',
  '#/pricing':'Pricing | The Mobile Bunker', '#/gallery':'Gallery | The Mobile Bunker',
  '#/faq':'FAQ | The Mobile Bunker', '#/contact':'Request a Quote | The Mobile Bunker',
  '#/admin':'Admin | The Mobile Bunker', '#/privacy':'Privacy Policy | The Mobile Bunker', '#/terms':'Terms | The Mobile Bunker' };
function router(){
  var raw=location.hash||'#/';
  var route=raw.split('?')[0].split('#').slice(0,2).join('#') || '#/';
  if(raw.indexOf('#/events#')===0) route='#/events';
  if(!ROUTES[route]) route='#/';
  document.title=TITLES[route]||TITLES['#/'];
  renderNav(route);
  el('main').innerHTML=ROUTES[route]();
  var admin = route==='#/admin';
  el('hdr').style.display = admin ? 'none' : '';
  el('ftr').style.display = admin ? 'none' : '';
  if(admin){ wireAdmin(); }
  if(route==='#/gallery'){
    paintGallery();
    el('filters').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
      galFilter=b.getAttribute('data-cat');
      document.querySelectorAll('#filters button').forEach(function(x){ x.classList.toggle('on',x===b); });
      paintGallery(); });
    el('gal').addEventListener('click',function(e){ var f=e.target.closest('figure'); if(f) openLb(+f.getAttribute('data-i')); });
    el('gal').addEventListener('keydown',function(e){ var f=e.target.closest('figure'); if(f&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openLb(+f.getAttribute('data-i')); } });
  }
  if(route==='#/faq'){
    document.querySelectorAll('.faq button').forEach(function(b){ b.onclick=function(){
      var p=b.parentNode, open=p.classList.contains('open');
      document.querySelectorAll('.faq').forEach(function(x){ x.classList.remove('open'); x.querySelector('button').setAttribute('aria-expanded','false'); });
      if(!open){ p.classList.add('open'); b.setAttribute('aria-expanded','true'); } }; });
  }
  if(route==='#/contact') wireForm();
  el('mobnav').classList.remove('open');
  wireReveal();
  var frag=raw.split('#/events#')[1];
  if(frag){ setTimeout(function(){ var n=el(frag); if(n) window.scrollTo({top:n.offsetTop-100,behavior:'smooth'}); },60); }
  else { window.scrollTo({top:0}); }
}

el('burger').onclick=function(){ var m=el('mobnav'); var o=m.classList.toggle('open'); this.setAttribute('aria-expanded',o); };
window.addEventListener('hashchange',router);
window.addEventListener('scroll',function(){ el('hdr').classList.toggle('scrolled',window.scrollY>20); });
(function(){ var fav=document.createElement('link'); fav.rel='icon'; fav.href=ASSETS.mark; document.head.appendChild(fav); var bm=el('brandmark'); if(bm){ bm.src=ASSETS.mark; bm.alt=DEFAULTS.brand.name; } })();
if('scrollRestoration' in history){ history.scrollRestoration='manual'; }
renderFooter();
router();
</script>
